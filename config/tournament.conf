# PyPI Mirror Tournament - Runtime Configuration

# Package used for real download throughput benchmark
BENCHMARK_PACKAGE="numpy"
DAILY_TEST_PACKAGE="packaging"
DAILY_DOWNLOAD_TIMEOUT=15

# Number of real download attempts per mirror
DOWNLOAD_RUNS=3

# Health-check limits
CONNECT_TIMEOUT=2
HEALTH_TIMEOUT=5
MAX_TTFB=2

# Maximum allowed time for each complete pip download run
DOWNLOAD_TIMEOUT=30

# A mirror must pass every download run to qualify
REQUIRE_ALL_RUNS=true

# Winner selection uses median download throughput
WINNER_METRIC="median_download_speed"

# Managed pip configuration
PIP_CONFIG="/home/mani/.config/pip/pip.conf"

# Project paths
PROJECT_ROOT="/workspace/projects/pypi-mirror-tournament"
LOG_DIR="/workspace/projects/pypi-mirror-tournament/logs"
STATE_DIR="/workspace/projects/pypi-mirror-tournament/state"

# Scheduling / selection policy

# Daily quick check tests only the current winner
DAILY_CHECK_INTERVAL="24h"

# Full tournament interval
FULL_TOURNAMENT_INTERVAL="7d"

# Challenger must be at least this much faster before replacing
# a healthy current winner.
SWITCH_THRESHOLD_PERCENT=15

# If the current winner fails the daily health check,
# an emergency full tournament should be triggered.
EMERGENCY_TOURNAMENT_ON_FAILURE=true
